# Test firmware for improv-client on an Unexpected Maker TinyS3 (ESP32-S3, native USB).
# Improv over USB serial and BLE, no Wi-Fi credentials, BOOT button authorizes BLE.
#
#   esphome run examples/esphome/improv-test-tinys3.yaml --device /dev/cu.usbmodemXXXX
#
# Provision it with improv-client, then wipe the credentials again with
#   esptool --port /dev/cu.usbmodemXXXX erase-flash
# and flash again to repeat the test.

esphome:
  name: improv-test-s3
  friendly_name: Improv Test S3

esp32:
  board: um_tinys3
  flash_size: 8MB
  framework:
    type: esp-idf

# Improv serial runs on the logger's port: the S3's native USB.
logger:
  hardware_uart: USB_SERIAL_JTAG

# No networks: credentials come from Improv.
wifi:

improv_serial:

binary_sensor:
  - platform: gpio
    id: boot_button
    name: Boot button
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true

esp32_improv:
  # Press BOOT to authorize BLE provisioning for one minute.
  authorizer: boot_button
  authorized_duration: 1min

web_server:
  port: 80
